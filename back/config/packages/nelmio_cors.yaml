nelmio_cors:
  defaults:
    allow_origin: ['*']
    allow_methods: ['GET', 'POST', 'OPTIONS', 'PUT', 'DELETE', 'PATCH']
    allow_headers: ['*']
    max_age: 3600
    origin_regex: true
  paths:
    '^/': # Autorise toutes les routes
      allow_origin: ['http://localhost:5174']
      allow_headers: ['*']
      allow_methods: ['GET', 'POST', 'OPTIONS', 'PUT', 'DELETE', 'PATCH']
      max_age: 3600


