nelmio_cors:
  paths:
    '^/':
      origin_regex: true
      allow_origin: ['^https?://localhost(:[0-9]+)?$']
      allow_methods: ['GET','POST','OPTIONS','PUT','DELETE','PATCH']
      allow_headers: ['Content-Type','Authorization']
      allow_credentials: true
      max_age: 3600




