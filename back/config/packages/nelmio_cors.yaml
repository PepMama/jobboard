nelmio_cors:
  defaults:
    origin_regex: true
    allow_origin: ['*']
    allow_headers: ['*']
    allow_methods: ['GET', 'POST', 'OPTIONS', 'PUT', 'DELETE', 'PATCH']
    max_age: 3600
  paths:
    '^/':

